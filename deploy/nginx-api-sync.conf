# 安装：sudo cp deploy/nginx-api-sync.conf /etc/nginx/sites-available/api-sync
#       sudo ln -sf /etc/nginx/sites-available/api-sync /etc/nginx/sites-enabled/api-sync
#       sudo nginx -t && sudo systemctl reload nginx
#
# 勿对未知路径 return 200 'api-sync ok' — 会导致 /jobs/* 从未到达 uvicorn。

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }
}

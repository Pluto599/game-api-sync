# 复制到 client 或 server 仓库：.github/workflows/api-review.yml
# 并在仓库 Settings → Secrets 添加 API_SYNC_TOKEN
# server 仓把 env API_REPO 改为 server、API_MODULE 改为对应模块

name: API Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  API_SYNC_BASE: http://120.27.249.20
  API_MODULE: 战斗
  API_REPO: client

jobs:
  api-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Pluto599/game-api-sync
          path: _api_sync

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run API review
        env:
          API_SYNC_TOKEN: ${{ secrets.API_SYNC_TOKEN }}
        run: |
          pip install -q pyyaml requests
          python3 _api_sync/scripts/run_api_review.py \
            --registry config/wiki-registry.yaml \
            --module "${{ env.API_MODULE }}" \
            --repo "${{ env.API_REPO }}" \
            --base-url "${{ env.API_SYNC_BASE }}" \
            --token "$API_SYNC_TOKEN" \
            --root . \
            --output report.json

      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = '## API Review\n\n无法生成报告（检查 API_SYNC_TOKEN 与 ECS 服务）。';
            if (fs.existsSync('report.json')) {
              try {
                const r = JSON.parse(fs.readFileSync('report.json', 'utf8'));
                body = r.report_md || JSON.stringify(r, null, 2);
              } catch (e) {
                body = '## API Review\n\n```\n' + fs.readFileSync('report.json', 'utf8') + '\n```';
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

name: API Doc Sync (Reusable)

on:
  workflow_call:
    inputs:
      game_repo:
        description: client or server
        required: true
        type: string
      mode:
        description: pr (report only) or main (conditional sync)
        required: true
        type: string
      base_ref:
        description: git base ref for diff
        required: false
        type: string
        default: main
      snapshot_ttl_hours:
        description: ECS snapshot TTL before refresh
        required: false
        type: string
        default: "6"
      orphan_policy:
        description: warn or fail on orphan protocol files
        required: false
        type: string
        default: warn
    secrets:
      API_SYNC_TOKEN:
        required: true

jobs:
  api-doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q pyyaml

      - name: Checkout game-api-sync scripts
        uses: actions/checkout@v4
        with:
          repository: Pluto599/game-api-sync
          path: _api-sync

      - name: Run sync job
        env:
          API_SYNC_BASE: http://120.27.249.20
          API_SYNC_TOKEN: ${{ secrets.API_SYNC_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/_api-sync/scripts
        run: |
          python _api-sync/scripts/ci/run_sync_job.py \
            --mode "${{ inputs.mode }}" \
            --repo "${{ inputs.game_repo }}" \
            --base-ref "${{ inputs.base_ref }}" \
            --ttl-hours "${{ inputs.snapshot_ttl_hours }}" \
            --orphan-policy "${{ inputs.orphan_policy }}"
